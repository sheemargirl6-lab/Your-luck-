<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Luck - Lucky Spin</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffe4f4,#e8d5ff);
color:#55216c;
text-align:center;
min-height:100vh;
padding:20px;
}
.container{
max-width:450px;
margin:25px auto;
background:white;
padding:25px 18px;
border-radius:25px;
box-shadow:0 10px 35px #a65bb555;
}
h1{color:#c02b91;margin:5px}
.subtitle{color:#8550a4}
.coins{
background:#fff0fa;
padding:12px;
border-radius:15px;
font-size:21px;
font-weight:bold;
margin:20px 0;
}
.wheel-wrap{
width:min(300px,80vw);
height:min(300px,80vw);
margin:25px auto;
position:relative;
}
.pointer{
position:absolute;
top:-13px;
left:50%;
transform:translateX(-50%);
z-index:2;
font-size:35px;
color:#9d36bd;
}
#wheel{
width:100%;
height:100%;
border-radius:50%;
border:8px solid white;
box-shadow:0 4px 20px #9146aa66;
background:conic-gradient(
#ff69b4 0deg 60deg,
#9b59b6 60deg 120deg,
#ffb6d9 120deg 180deg,
#7d3c98 180deg 240deg,
#ff69b4 240deg 300deg,
#c39bd3 300deg 360deg);
transition:transform 5s cubic-bezier(.15,.7,.1,1);
position:relative;
}
.labels{
position:absolute;
inset:0;
border-radius:50%;
pointer-events:none;
}
.labels span{
position:absolute;
left:50%;
top:50%;
width:65px;
margin-left:-32px;
margin-top:-12px;
font-size:17px;
font-weight:bold;
color:white;
text-shadow:1px 1px 3px #633;
}
.labels span:nth-child(1){transform:rotate(30deg) translateY(-100px) rotate(-30deg)}
.labels span:nth-child(2){transform:rotate(90deg) translateY(-100px) rotate(-90deg)}
.labels span:nth-child(3){transform:rotate(150deg) translateY(-100px) rotate(-150deg)}
.labels span:nth-child(4){transform:rotate(210deg) translateY(-100px) rotate(-210deg)}
.labels span:nth-child(5){transform:rotate(270deg) translateY(-100px) rotate(-270deg)}
.labels span:nth-child(6){transform:rotate(330deg) translateY(-100px) rotate(-330deg)}
button{
border:0;
padding:15px 35px;
border-radius:30px;
background:linear-gradient(90deg,#ec4899,#9333ea);
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 15px #b65bc566;
}
button:disabled{opacity:.6}
#result{
font-size:23px;
font-weight:bold;
margin:22px 0;
min-height:30px;
color:#a0269b;
}
.note{font-size:12px;color:#888;margin-top:20px}
</style>
</head>
<body>
  <div id="wallet" style="background:#17172b;color:white;padding:20px;border-radius:15px;text-align:center;margin:20px 0;">
  <h2>🪙 Your Luck Wallet</h2>
  <h1 id="coinBalance">0 Coins</h1>
  <p>Total Coin Supply: 500000</p>
</div>
<div class="container">
<h1>💜 Your-Luck 💜</h1>
<p class="subtitle">✨ Lucky Spin Gaming Platform ✨</p>

<div class="coins">🪙 Virtual Coins: <span id="coins">0</span></div>

<div class="wheel-wrap">
<div class="pointer">▼</div>
<div id="wheel">
<div class="labels">
<span>10</span><span>20</span><span>30</span>
<span>50</span><span>100</span><span>500</span>
</div>
</div>
</div>

<button id="spin" onclick="spinWheel()">🎡 SPIN NOW</button>
<div id="result">Good Luck! ❤️</div>
<p class="note">This is a virtual coin demo game. No real money or prizes.</p>
</div>

<script>
  // 🎉 YOUR LUCK WINNING EFFECTS

const style = document.createElement("style");
style.textContent = `
.win-popup {
  position:fixed;
  top:35%;
  left:10%;
  width:80%;
  padding:25px 10px;
  background:linear-gradient(135deg,#ff69b4,#8a2be2);
  color:white;
  text-align:center;
  border-radius:20px;
  font-size:22px;
  z-index:9999;
  box-shadow:0 0 30px pink;
  animation:pop .5s ease;
}
@keyframes pop {
  from {transform:scale(.2);opacity:0}
  to {transform:scale(1);opacity:1}
}
.confetti {
  position:fixed;
  top:-20px;
  z-index:9998;
  font-size:25px;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
}
@keyframes fall {
  to {transform:translateY(110vh) rotate(720deg);opacity:0}
}
`;
document.head.appendChild(style);

function winSound() {
  try {
    const audio = new AudioContext();
    [523,659,784,1046].forEach((freq,i)=>{
      const oscillator=audio.createOscillator();
      const gain=audio.createGain();
      oscillator.frequency.value=freq;
      oscillator.connect(gain);
      gain.connect(audio.destination);
      gain.gain.setValueAtTime(.12,audio.currentTime+i*.12);
      gain.gain.exponentialRampToValueAtTime(
        .001,audio.currentTime+i*.12+.2
      );
      oscillator.start(audio.currentTime+i*.12);
      oscillator.stop(audio.currentTime+i*.12+.2);
    });
  } catch(e) {}
}

function showWin() {
  winSound();

  const popup=document.createElement("div");
  popup.className="win-popup";
  popup.innerHTML="🎉 CONGRATULATIONS! 🎉<br>🏆 YOU WON!";

  document.body.appendChild(popup);

  for(let i=0;i<35;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.innerText=["🎊","✨","💖","🌟"][Math.floor(Math.random()*4)];
    c.style.left=Math.random()*100+"vw";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2500);
  }

  setTimeout(()=>popup.remove(),2500);
}

const resultBox=document.getElementById("result");

if(resultBox){
  const observer=new MutationObserver(()=>{
    if(/won|जीते| जीत/i.test(resultBox.innerText)){
      showWin();
    }
  });
  observer.observe(resultBox,{childList:true,characterData:true,subtree:true});
  }
  
let total=0;
let rotation=0;
let spinning=false;
const prizes=[10,20,30,50,100,500];

function spinWheel(){
  let spinAudioCtx, spinOsc, spinGain, spinLfo, spinLfoGain;

function startSpinSound(){
  spinAudioCtx = new (window.AudioContext || window.webkitAudioContext)();

  spinOsc = spinAudioCtx.createOscillator();
  spinGain = spinAudioCtx.createGain();
  spinLfo = spinAudioCtx.createOscillator();
  spinLfoGain = spinAudioCtx.createGain();

  spinOsc.frequency.value = 120;
  spinLfo.frequency.value = 9;
  spinLfoGain.gain.value = 25;
  spinGain.gain.value = 0.025;

  spinLfo.connect(spinLfoGain);
  spinLfoGain.connect(spinOsc.frequency);
  spinOsc.connect(spinGain);
  spinGain.connect(spinAudioCtx.destination);

  spinOsc.start();
  spinLfo.start();
}

function stopSpinSound(){
  if(!spinAudioCtx) return;

  spinGain.gain.setTargetAtTime(
    0, spinAudioCtx.currentTime, 0.05
  );

  spinOsc.stop(spinAudioCtx.currentTime + 0.2);
  spinLfo.stop(spinAudioCtx.currentTime + 0.2);

  setTimeout(()=>{
    spinAudioCtx.close();
  },300);
  }
if(spinning)return;
spinning=true
  startSpinSound();
const btn=document.getElementById("spin");
const wheel=document.getElementById("wheel");
const result=document.getElementById("result");

btn.disabled=true;
result.textContent="✨ Spinning...";

const index=Math.floor(Math.random()*prizes.length);
const prize=prizes[index];
const angle=360-index*60-30;

rotation+=1800+angle-(rotation%360);
wheel.style.transform="rotate("+rotation+"deg)";

setTimeout(()=>{
stopSpinSound();
total+=prize;
document.getElementById("coins").textContent=total;
result.textContent="🎉 Congratulations! You won "+prize+" coins! 💜";
btn.disabled=false;
spinning=false;
},5100);
}
</script>
